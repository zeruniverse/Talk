worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen __LISTEN_PORT__;
        server_name _;

        location ^~ /function {
            deny all;
            return 403;
        }

        location = / {
            add_header Content-Type application/json;
            return 200 '{"success":true,"service":"Talk backend"}';
        }

        location = /health.php {
            rewrite ^ /api/health.php last;
        }

        location ~ ^/api/([A-Za-z0-9_-]+\.php)$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME __ROOT_DIR__/backend/api/$1;
            fastcgi_param SCRIPT_NAME /api/$1;
            fastcgi_param DOCUMENT_ROOT __ROOT_DIR__/backend;

            fastcgi_param DB_HOST_B64 "__DB_HOST_B64__";
            fastcgi_param DB_PORT_B64 "__DB_PORT_B64__";
            fastcgi_param DB_NAME_B64 "__DB_NAME_B64__";
            fastcgi_param DB_USER_B64 "__DB_USER_B64__";
            fastcgi_param DB_PASSWORD_B64 "__DB_PASSWORD_B64__";
            fastcgi_param FRONTEND_URL_B64 "__FRONTEND_URL_B64__";
            fastcgi_param ALLOW_NO_ORIGIN_REQUESTS_B64 "__ALLOW_NO_ORIGIN_REQUESTS_B64__";
            fastcgi_param TZ_B64 "__TZ_B64__";
            fastcgi_param GLOBAL_SALT_3_B64 "__GLOBAL_SALT_3_B64__";
            fastcgi_param MAX_CIPHERTEXT_BYTES_B64 "__MAX_CIPHERTEXT_BYTES_B64__";
            fastcgi_param DEFAULT_EXPIRE_DAYS_B64 "__DEFAULT_EXPIRE_DAYS_B64__";
            fastcgi_param MAX_EXPIRE_DAYS_B64 "__MAX_EXPIRE_DAYS_B64__";
            fastcgi_param MIN_PBKDF2_ITERATIONS_B64 "__MIN_PBKDF2_ITERATIONS_B64__";
            fastcgi_param MAX_PBKDF2_ITERATIONS_B64 "__MAX_PBKDF2_ITERATIONS_B64__";
            fastcgi_param RATE_LIMIT_WINDOW_B64 "__RATE_LIMIT_WINDOW_B64__";
            fastcgi_param RATE_LIMIT_CREATE_B64 "__RATE_LIMIT_CREATE_B64__";
            fastcgi_param RATE_LIMIT_META_B64 "__RATE_LIMIT_META_B64__";
            fastcgi_param RATE_LIMIT_OPEN_B64 "__RATE_LIMIT_OPEN_B64__";
            fastcgi_param RATE_LIMIT_OPEN_CODE_B64 "__RATE_LIMIT_OPEN_CODE_B64__";
            fastcgi_param CLEANUP_LIMIT_B64 "__CLEANUP_LIMIT_B64__";
        }

        location /api/ {
            return 404;
        }
    }
}
