error_log  /tmp/nginx-error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/nginx-client-body;
    client_max_body_size 20m;

    server {
        listen __LISTEN_PORT__;
        server_name _;
        root __APP_ROOT__/backend;
        index index.php;

        location ^~ /function {
            deny all;
            return 403;
        }

        location /api/ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param DB_HOST_B64 "__DB_HOST_B64__";
            fastcgi_param DB_PORT_B64 "__DB_PORT_B64__";
            fastcgi_param DB_NAME_B64 "__DB_NAME_B64__";
            fastcgi_param DB_USER_B64 "__DB_USER_B64__";
            fastcgi_param DB_PASSWORD_B64 "__DB_PASSWORD_B64__";
            fastcgi_param FRONTEND_URL_B64 "__FRONTEND_URL_B64__";
            fastcgi_param ALLOW_NO_ORIGIN_REQUESTS_B64 "__ALLOW_NO_ORIGIN_REQUESTS_B64__";
            fastcgi_param TZ_B64 "__TZ_B64__";
            fastcgi_param GLOBAL_SALT_3_B64 "__GLOBAL_SALT_3_B64__";
            fastcgi_param PBKDF2_ITERATIONS_B64 "__PBKDF2_ITERATIONS_B64__";
            fastcgi_param MAX_FILE_SUM_BYTES_B64 "__MAX_FILE_SUM_BYTES_B64__";
            fastcgi_param MAX_CIPHERTEXT_BYTES_B64 "__MAX_CIPHERTEXT_BYTES_B64__";
            fastcgi_param CODE_LENGTH_B64 "__CODE_LENGTH_B64__";
            fastcgi_param DEFAULT_EXPIRE_DAYS_B64 "__DEFAULT_EXPIRE_DAYS_B64__";
            fastcgi_param MAX_EXPIRE_DAYS_B64 "__MAX_EXPIRE_DAYS_B64__";
            fastcgi_param CREATE_LIMIT_PER_HOUR_B64 "__CREATE_LIMIT_PER_HOUR_B64__";
            fastcgi_param CHECK_LIMIT_PER_HOUR_B64 "__CHECK_LIMIT_PER_HOUR_B64__";
        }

        location / {
            return 404;
        }
    }
}
